template:
  - sensor:
      - name: "Desktop Volume Level"
        unique_id: "mqtt_media_remote_desktop_volume_level"
        unit_of_measurement: "ratio"
        icon: mdi:volume-high
        state: >-
          {{ states('sensor.desktop_volume') | default(0) | float / 100 }}

  - binary_sensor:
      - name: "Desktop Media Playing"
        unique_id: "mqtt_media_remote_desktop_media_playing"
        device_class: running
        icon: mdi:play
        state: >-
          {{ states('sensor.desktop_playback_status') | default('') | lower in ['playing', 'play'] }}
