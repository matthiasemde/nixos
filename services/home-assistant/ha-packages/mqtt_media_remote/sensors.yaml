mqtt:
  sensor:
    - name: "Desktop Volume"
      unique_id: "mqtt_media_remote_desktop_volume"
      state_topic: "home/desktop/media-remote/state/volume"
      unit_of_measurement: "%"
      icon: mdi:volume-high
      value_template: >-
        {% set vol = value | default('Volume: 0') | regex_replace('Volume:\s*([\d.]+).*', '\1') | float(0) %}
        {{ (vol * 100) | round(0) }}

    - name: "Desktop Playback Status"
      unique_id: "mqtt_media_remote_desktop_playback_status"
      state_topic: "home/desktop/media-remote/state/playback/status"
      icon: mdi:play-pause

    - name: "Desktop Current Sink"
      unique_id: "mqtt_media_remote_desktop_current_sink"
      state_topic: "home/desktop/media-remote/state/sink/current"
      icon: mdi:speaker
      value_template: "{{ value_json.name | default('Unknown') }}"
      json_attributes_topic: "home/desktop/media-remote/state/sink/current"
      json_attributes_template: "{{ value_json | tojson }}"
